<svg class="safety-miniature" viewBox="0 0 900 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração original de um ambiente industrial em miniatura: trabalhadores com capacetes e coletes, uma esteira em movimento e uma câmera de segurança">
<defs>
 <linearGradient id="base-top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#767373"/><stop offset="1" stop-color="#3b3838"/></linearGradient>
