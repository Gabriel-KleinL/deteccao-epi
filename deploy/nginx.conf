# Entrada exclusiva do túnel Cloudflare para epi.in9automacao.com.br.
# Somente arquivos e rotas necessários ficam publicados.
server {
    listen 127.0.0.1:50063;
    server_name epi.in9automacao.com.br;
    root /srv/apps/deteccao-epi;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;

    location = / { return 302 /interface.html; }
    location = /apresentacao { return 302 /apresentacao-escola.html; }
    location ~ ^/(apresentacao-escola|interface|supervisor|index)\.html$ {
        try_files $uri =404;
    }
    location = /recursos/identidade-i9/sistema.css { try_files $uri =404; }

    location ~ ^/(quiz|professor|quiz/(index\.html|app\.js|style\.css|foto\.png)|api/(info|state|create|join|action|answer))$ {
        proxy_pass http://127.0.0.1:50064;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
    }

    location ~ ^/api/(config|capturas)$ {
        proxy_pass http://127.0.0.1:50061;
        proxy_set_header Host $host;
    }
    location ~ ^/resultados/capturas/[a-zA-Z0-9_.-]+\.jpg$ {
        try_files $uri =404;
    }
    location = /stream {
        proxy_pass http://127.0.0.1:50061;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:50062;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location / { return 404; }
}
