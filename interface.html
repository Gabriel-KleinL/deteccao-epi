<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Detecção EPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:            #121212;
    --surface:       #1A1A1A;
    --card:          #252525;
    --border:        #333333;
    --primary:       #C73C3C;
    --primary-dark:  #A32F2F;
    --primary-light: #E85555;
    --green:         #22c55e;
    --red:           #C73C3C;
    --orange:        #ff8c00;
    --blue:          #0F35A9;
    --blue-light:    #1D4ED8;
    --yellow:        #ffd60a;
    --text:          #FFFFFF;
    --muted:         #A0A0A0;
    --mono:          'Share Tech Mono', 'Courier New', monospace;
    --sans:          'Barlow', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: grid;
    grid-template-rows: 44px 1fr;
    grid-template-columns: 1fr 280px;
    overflow: hidden;
  }

  /* HEADER */
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 2px solid var(--primary-dark);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 24px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--primary);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .status-bar {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .status-bar span  { letter-spacing: 0.08em; }
  .status-bar .val  { color: var(--primary-light); }

  /* CAMERA */
  .camera-area {
    position: relative;
    background: #000;
    overflow: hidden;
  }

  video, #canvas-zona {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvas-zona {
    z-index: 2;
  }

  #canvas-boxes {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
  }

  /* mode cursors */
  #canvas-zona.modo-desenho  { cursor: crosshair; }
  #canvas-zona.modo-idle     { cursor: default; }

  /* scanlines */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 4;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
  }

  /* brackets */
  .bracket {
    position: absolute;
    width: 28px; height: 28px;
    border-color: var(--primary);
    border-style: solid;
    opacity: 0.65;
    z-index: 5;
    pointer-events: none;
  }
  .bracket.tl { top: 16px;    left: 16px;  border-width: 2px 0 0 2px; }
  .bracket.tr { top: 16px;    right: 16px; border-width: 2px 2px 0 0; }
  .bracket.bl { bottom: 16px; left: 16px;  border-width: 0 0 2px 2px; }
  .bracket.br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

  .cam-label {
    position: absolute;
    top: 20px; left: 54px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--primary);
    letter-spacing: 0.15em;
    opacity: 0.85;
    z-index: 6;
    pointer-events: none;
  }

  /* modo desenho badge */
  .badge-desenho {
    display: none;
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--primary);
    background: rgba(18,18,18,0.85);
    border: 1px solid var(--primary);
    padding: 5px 14px;
    pointer-events: none;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  .badge-desenho.visivel { display: block; }

  /* cam-off */
  .cam-off {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #000;
  }

  .cam-off svg { opacity: 0.2; }

  .cam-off p {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .btn-cam {
    margin-top: 8px;
    padding: 8px 20px;
    background: transparent;
    border: 1px solid var(--primary);
    color: var(--primary);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .btn-cam:hover { background: var(--primary); color: #fff; }

  .camera-select {
    width: min(320px, 86%);
    margin-top: 2px;
    padding: 8px 10px;
    background: rgba(18,18,18,0.9);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    border-radius: 3px;
    outline: none;
  }

  .camera-select:focus {
    border-color: var(--primary);
  }

  /* botão resetar câmera */
  .btn-reset-cam {
    display: none;
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 7;
    padding: 7px 16px;
    background: rgba(18,18,18,0.75);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
  }

  .btn-reset-cam:hover { border-color: var(--primary); color: var(--primary); }
  .btn-reset-cam.visivel { display: block; }

  /* PANEL */
  .panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 20px 16px;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ZONA */
  .zona-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .btn-zona {
    padding: 7px 0;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }

  .btn-zona:hover { border-color: var(--primary); color: var(--primary); }

  .btn-zona.ativo {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(199,60,60,0.1);
  }

  .btn-zona.perigo:hover,
  .btn-zona.perigo.ativo {
    border-color: var(--primary);
    color: var(--primary-light);
    background: rgba(199,60,60,0.12);
  }

  /* modo dentro/fora */
  .modo-zona {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .modo-btn {
    padding: 6px 0;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .modo-btn:first-child { border-right: 1px solid var(--border); }

  .modo-btn.selecionado {
    background: var(--primary);
    color: #fff;
  }

  /* ZONA ITEM */
  .zona-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 4px;
  }

  .zona-item-cor {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .zona-item-nome {
    flex: 1;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .zona-item-pts {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .zona-item-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 2px;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .zona-item-btn:hover { color: var(--primary); }

  /* ZONE EDITOR */
  .ze-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 6px;
  }

  .ze-input {
    width: 100%;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    border-radius: 3px;
    outline: none;
  }

  .ze-input:focus { border-color: var(--primary); }

  .ze-cores {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .ze-cor {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
  }

  .ze-cor:hover   { transform: scale(1.15); }
  .ze-cor.selecionada { border-color: #fff; }

  .ze-sub {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 2px 0 0;
  }

  .ze-classe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
    cursor: pointer;
    user-select: none;
  }

  .ze-classe-info {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text);
  }

  .ze-classe-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ze-switch {
    width: 28px; height: 15px;
    background: var(--border);
    border-radius: 8px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .ze-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }

  .ze-classe-row input:checked ~ .ze-switch {
    background: color-mix(in srgb, var(--ze-accent, #22c55e) 35%, transparent);
  }

  .ze-classe-row input:checked ~ .ze-switch::after {
    transform: translateX(13px);
    background: var(--ze-accent, #22c55e);
  }

  .ze-classe-row input { display: none; }
  .ze-classe-row.disabled { opacity: 0.35; cursor: not-allowed; }

  /* TOGGLES */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.2s;
  }

  .toggle-row:hover   { opacity: 0.85; }
  .toggle-row.disabled { opacity: 0.3; }
  .toggle-row.disabled:hover { opacity: 0.3; }

  .toggle-info {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .color-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .toggle-label {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    line-height: 1;
  }

  input[type="checkbox"] { display: none; }

  .switch {
    width: 34px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }

  input[type="checkbox"]:checked + .switch {
    background: color-mix(in srgb, var(--accent) 30%, transparent);
  }

  input[type="checkbox"]:checked + .switch::after {
    transform: translateX(16px);
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2px 0;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <span class="logo">i9 Automação — Sistema EPI</span>
  <div class="status-bar">
    <span id="ts" class="val">--:--:--</span>
    <span>CAM 01</span>
    <span id="active-count" class="val">0 ATIVOS</span>
    <span id="zona-header" style="display:none">|</span>
    <span id="zona-header-txt" class="val" style="display:none"></span>
    <a href="supervisor.html" style="padding:5px 13px;background:transparent;border:1px solid var(--primary-dark);color:var(--primary);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-decoration:none;border-radius:3px;transition:all .15s" onmouseover="this.style.background='var(--primary)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='var(--primary)'">SUPERVISOR →</a>
  </div>
</header>

<div class="camera-area" id="cam-area">
  <div class="cam-off" id="cam-off">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2">
      <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
    </svg>
    <p>CÂMERA INATIVA</p>
    <p id="camera-status" style="max-width:360px;text-align:center;line-height:1.5">Clique em procurar câmeras</p>
    <select class="camera-select" id="camera-select-overlay"></select>
    <button class="btn-cam" id="btn-search-camera">PROCURAR CÂMERAS</button>
    <button class="btn-cam" id="btn-start">INICIAR CÂMERA</button>
  </div>

  <video id="video" autoplay muted playsinline></video>
  <img id="stream-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none" alt="">
  <canvas id="canvas-zona" class="modo-idle"></canvas>
  <canvas id="canvas-boxes"></canvas>

  <div class="scanlines"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
  <span class="cam-label">LIVE</span>
  <button class="btn-reset-cam" id="btn-reset-cam">⟳ RESETAR CÂMERA</button>
  <div class="badge-desenho" id="badge-desenho">
    CLIQUE PARA MARCAR — DUPLO CLIQUE PARA FECHAR — ESC CANCELA
  </div>
</div>

<div class="panel">

  <!-- ZONAS -->
  <div>
    <div class="section-title">Zonas de Detecção</div>

    <div id="lista-zonas"></div>

    <div class="zona-btns" style="margin-top:4px">
      <button class="btn-zona" onclick="abrirEditor(null)" style="grid-column:1/-1">+ NOVA ZONA</button>
    </div>

    <!-- Editor de zona -->
    <div class="ze-box" id="ze-box" style="display:none">
      <input class="ze-input" id="ze-nome" type="text" placeholder="Nome da zona" maxlength="22">

      <div>
        <div class="ze-sub">Cor</div>
        <div class="ze-cores" id="ze-cores"></div>
      </div>

      <div>
        <div class="ze-sub" style="margin-bottom:5px">Modo</div>
        <div class="modo-zona">
          <button class="modo-btn selecionado" id="ze-btn-dentro" onclick="setEditorModo('dentro')">DENTRO</button>
          <button class="modo-btn" id="ze-btn-fora" onclick="setEditorModo('fora')">FORA</button>
        </div>
      </div>

      <div>
        <div class="ze-sub">Classes desta zona</div>
        <div id="ze-classes"></div>
      </div>

      <div class="zona-btns">
        <button class="btn-zona" id="ze-btn-desenhar" onclick="zeDesenhar()">DESENHAR</button>
        <button class="btn-zona perigo" onclick="zeLimpar()">LIMPAR</button>
      </div>
      <div class="zona-btns">
        <button class="btn-zona" onclick="zeSalvar()" style="border-color:var(--green);color:var(--green)">SALVAR</button>
        <button class="btn-zona" onclick="zeCancelar()">CANCELAR</button>
      </div>
    </div>

    <div class="zona-btns" style="margin-top:6px">
      <button class="btn-zona ativo" id="btn-caixas" onclick="toggleCaixas()">CAIXAS DE DETECÇÃO</button>
      <button class="btn-zona" id="btn-modo-cam" onclick="toggleModoCam()" title="Usar câmera do servidor via MJPEG (útil quando servidor está em outra máquina)">CÂMERA SERVIDOR</button>
    </div>
    <div class="zona-btns" style="margin-top:6px">
      <button class="btn-zona" id="btn-search-camera-panel" onclick="procurarCameras(true)" style="grid-column:1/-1">PROCURAR CÂMERAS</button>
    </div>
    <select class="ze-input" id="camera-select-panel" style="margin-top:6px"></select>
  </div>

  <hr>

  <!-- EPI PRESENTE -->
  <div>
    <div class="section-title">EPI Presente</div>

    <label class="toggle-row" style="--accent: var(--green)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--green)"></div>
        <span class="toggle-label">Capacete</span>
      </div>
      <input type="checkbox" data-classe="Capacete" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--green)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--green)"></div>
        <span class="toggle-label">Máscara</span>
      </div>
      <input type="checkbox" data-classe="Mascara" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--green)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--green)"></div>
        <span class="toggle-label">Colete</span>
      </div>
      <input type="checkbox" data-classe="Colete" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--green)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--green)"></div>
        <span class="toggle-label">Óculos de Proteção</span>
      </div>
      <input type="checkbox" data-classe="Oculos de Protecao" onchange="atualizar()">
      <div class="switch"></div>
    </label>
  </div>

  <hr>

  <!-- EPI AUSENTE -->
  <div>
    <div class="section-title">EPI Ausente</div>

    <label class="toggle-row" style="--accent: var(--red)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--red)"></div>
        <span class="toggle-label">Sem Capacete</span>
      </div>
      <input type="checkbox" data-classe="SEM-Capacete" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--red)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--red)"></div>
        <span class="toggle-label">Sem Máscara</span>
      </div>
      <input type="checkbox" data-classe="SEM-Mascara" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--red)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--red)"></div>
        <span class="toggle-label">Sem Colete</span>
      </div>
      <input type="checkbox" data-classe="SEM-Colete" onchange="atualizar()">
      <div class="switch"></div>
    </label>

    <label class="toggle-row" style="--accent: var(--red)">
      <div class="toggle-info">
        <div class="color-dot" style="background:var(--red)"></div>
        <span class="toggle-label">Sem Óculos de Proteção</span>
      </div>
      <input type="checkbox" data-classe="SEM-Oculos de Protecao" onchange="atualizar()">
      <div class="switch"></div>
    </label>
  </div>

</div>

<script>
let wsCliente     = null;
let classesAtivas = new Set();
let caixasAtivas  = true;
let ultimasCaixas = [];
let canvasBoxes   = null;
let ctxBoxes      = null;
let canvasEnvio   = document.createElement('canvas');
let envioEmAndamento = false;
let envioTimer = null;
let envioTimeout = null;
let sessaoLocal = null;
let inferenciaLocalAtiva = false;
let inferenciaRodando = false;
let inferenciaTimer = null;
let canvasInferencia = document.createElement('canvas');

// ─── câmera ───────────────────────────────────────────────────────────────
let streamAtivo = null;
let modoServidor = false;
let cameraAtualId = localStorage.getItem('epi_camera_id') || '';
let camerasConhecidas = [];

function statusCamera(msg) {
  const el = document.getElementById('camera-status');
  if (el) el.textContent = msg;
}

function textoErroCamera(err) {
  const nome = err?.name || 'Erro';
  const msg = err?.message ? ` (${err.message})` : '';
  const mapa = {
    NotAllowedError: 'Permissao de camera bloqueada pelo navegador.',
    NotFoundError: 'Nenhuma camera foi encontrada pelo navegador.',
    NotReadableError: 'A camera existe, mas esta ocupada por outro aplicativo.',
    OverconstrainedError: 'A camera selecionada nao esta disponivel neste notebook.',
    SecurityError: 'O navegador bloqueou o acesso por seguranca.',
  };
  return `${mapa[nome] || 'Nao foi possivel acessar a camera.'} ${nome}${msg}`;
}

function selectsCamera() {
  return [
    document.getElementById('camera-select-overlay'),
    document.getElementById('camera-select-panel'),
  ].filter(Boolean);
}

function preencherSelectCameras(cameras) {
  camerasConhecidas = cameras;
  selectsCamera().forEach(sel => {
    sel.innerHTML = '';
    if (!cameras.length) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'Nenhuma câmera encontrada';
      sel.appendChild(opt);
      return;
    }

    cameras.forEach((cam, i) => {
      const opt = document.createElement('option');
      opt.value = cam.deviceId;
      opt.textContent = cam.label || `Camera ${i + 1}`;
      sel.appendChild(opt);
    });

    if (cameraAtualId && cameras.some(cam => cam.deviceId === cameraAtualId)) {
      sel.value = cameraAtualId;
    } else {
      sel.value = cameras[0].deviceId;
      cameraAtualId = sel.value;
      localStorage.setItem('epi_camera_id', cameraAtualId);
    }
  });
}

async function listarCameras(pedirPermissao = false) {
  if (!navigator.mediaDevices?.enumerateDevices) {
    throw new Error('Navegador sem suporte a câmera.');
  }

  if (pedirPermissao) {
    statusCamera('Solicitando permissao da camera...');
    const temp = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    temp.getTracks().forEach(t => t.stop());
  }

  const devices = await navigator.mediaDevices.enumerateDevices();
  const cameras = devices.filter(d => d.kind === 'videoinput');
  preencherSelectCameras(cameras);
  statusCamera(cameras.length ? `${cameras.length} camera(s) encontrada(s)` : 'Nenhuma camera encontrada');
  return cameras;
}

async function procurarCameras(iniciarDepois = false) {
  try {
    const cameras = await listarCameras(true);
    if (!cameras.length) {
      alert('Nenhuma câmera encontrada neste computador.');
      return;
    }
    if (iniciarDepois) await iniciarCamera(true, cameraAtualId);
  } catch (err) {
    const msg = textoErroCamera(err);
    statusCamera(msg);
    alert(msg);
  }
}

async function iniciarCamera(alertarErro = false, deviceId = cameraAtualId) {
  try {
    if (modoServidor) {
      modoServidor = false;
      const img = document.getElementById('stream-img');
      const btn = document.getElementById('btn-modo-cam');
      img.style.display = 'none';
      img.src = '';
      btn.classList.remove('ativo');
      btn.textContent = 'CÂMERA SERVIDOR';
    }
    if (!camerasConhecidas.length) {
      await listarCameras(false).catch(() => {});
    }

    let constraints = deviceId
      ? { video: { deviceId: { exact: deviceId } }, audio: false }
      : { video: true, audio: false };

    if (streamAtivo) streamAtivo.getTracks().forEach(t => t.stop());

    statusCamera('Abrindo camera...');
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (err) {
      if (deviceId && ['NotFoundError', 'OverconstrainedError'].includes(err?.name)) {
        cameraAtualId = '';
        localStorage.removeItem('epi_camera_id');
        constraints = { video: true, audio: false };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
      } else {
        throw err;
      }
    }

    streamAtivo  = stream;
    const track = stream.getVideoTracks()[0];
    const settings = track?.getSettings?.() || {};
    if (settings.deviceId) {
      cameraAtualId = settings.deviceId;
      localStorage.setItem('epi_camera_id', cameraAtualId);
      selectsCamera().forEach(sel => { if (sel.value !== cameraAtualId) sel.value = cameraAtualId; });
    }
    const video  = document.getElementById('video');
    video.srcObject = stream;
    document.getElementById('cam-off').style.display = 'none';
    document.getElementById('btn-reset-cam').classList.add('visivel');
    video.addEventListener('loadedmetadata', sincronizarCanvas);
    iniciarInferenciaLocal();
    statusCamera('Camera ativa');
    listarCameras(false).catch(() => {});
  } catch (err) {
    const msg = textoErroCamera(err);
    statusCamera(msg);
    document.getElementById('cam-off').style.display = 'flex';
    if (alertarErro) alert(msg);
  }
}

document.getElementById('btn-start').addEventListener('click', () => iniciarCamera(true));

function pararEnvioFrames() {
  if (envioTimer) clearInterval(envioTimer);
  if (envioTimeout) clearTimeout(envioTimeout);
  envioTimer = null;
  envioTimeout = null;
  envioEmAndamento = false;
}

function pararInferenciaLocal() {
  if (inferenciaTimer) clearInterval(inferenciaTimer);
  inferenciaTimer = null;
  inferenciaRodando = false;
}

function iniciarEnvioFrames() {
  pararEnvioFrames();
  envioTimer = setInterval(enviarFrameCliente, 500);
}

function enviarFrameCliente() {
  if (envioEmAndamento || modoServidor) return;
  if (!wsCliente || wsCliente.readyState !== WebSocket.OPEN) return;
  const video = document.getElementById('video');
  if (!streamAtivo || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;

  envioEmAndamento = true;
  const maxW = 640;
  const escala = Math.min(1, maxW / video.videoWidth);
  canvasEnvio.width = Math.max(1, Math.round(video.videoWidth * escala));
  canvasEnvio.height = Math.max(1, Math.round(video.videoHeight * escala));
  const ctxEnvio = canvasEnvio.getContext('2d', { willReadFrequently: false });
  ctxEnvio.drawImage(video, 0, 0, canvasEnvio.width, canvasEnvio.height);
  canvasEnvio.toBlob(blob => {
    if (!blob) {
      envioEmAndamento = false;
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        if (wsCliente && wsCliente.readyState === WebSocket.OPEN) {
          wsCliente.send(JSON.stringify({ tipo: 'frame_cliente', imagem: reader.result }));
          if (envioTimeout) clearTimeout(envioTimeout);
          envioTimeout = setTimeout(() => {
            envioEmAndamento = false;
            envioTimeout = null;
          }, 25000);
        } else {
          envioEmAndamento = false;
        }
      } catch {
        envioEmAndamento = false;
      }
    };
    reader.onerror = () => { envioEmAndamento = false; };
    reader.readAsDataURL(blob);
  }, 'image/jpeg', 0.55);
}

function configurarSelectsCamera() {

      iniciarCamera(true, cameraAtualId);
    });
  });
}

function abrirEditor(id) {
  editId = id;

function canvasCoord(normPt) {
  const vid = document.getElementById('video');
  const cW  = canvas.width, cH = canvas.height;
  const vW  = vid.videoWidth || cW, vH = vid.videoHeight || cH;
  const scale = Math.max(cW / vW, cH / vH);
  const dW = vW * scale, dH = vH * scale;
  const offX = (cW - dW) / 2, offY = (cH - dH) / 2;
  return { x: normPt.x * dW + offX, y: normPt.y * dH + offY };
}

function normCoord(canvasPt) {
  const vid = document.getElementById('video');
  const cW  = canvas.width, cH = canvas.height;
  const vW  = vid.videoWidth || cW, vH = vid.videoHeight || cH;
  const scale = Math.max(cW / vW, cH / vH);
  const dW = vW * scale, dH = vH * scale;
  const offX = (cW - dW) / 2, offY = (cH - dH) / 2;
  return {
    x: parseFloat(((canvasPt.x - offX) / dW).toFixed(4)),
    y: parseFloat(((canvasPt.y - offY) / dH).toFixed(4)),
  };
}

function zeDesenhar() {

  cursor      = null;
  canvas.classList.replace('modo-desenho', 'modo-idle');

  document.getElementById('ze-btn-desenhar').classList.remove('ativo');
  renderizar();
}

function zeLimpar() {
  editPontos  = [];
  editFechada = false;
  desenhando  = false;
  cursor      = null;
  canvas.classList.replace('modo-desenho', 'modo-idle');
  document.getElementById('badge-desenho').classList.remove('visivel');
  document.getElementById('ze-btn-desenhar').classList.remove('ativo');

}

function zeSalvar() {
  const nome = document.getElementById('ze-nome').value.trim() || 'Zona ' + (zonas.length + 1);
  const pontosNorm = editPontos.map(normCoord);

  if (editId && zonas.find(z => z.id === editId)) {
    const z = zonas.find(z => z.id === editId);
    Object.assign(z, { nome, cor: editCor, modo: editModo, pontos: pontosNorm,
                        classes: [...editClasses], fechada: editFechada });
  } else {
    zonas.push({
      id:      'z_' + Date.now(),
      nome,
      cor:     editCor,
      modo:    editModo,
      pontos:  pontosNorm,
      classes: [...editClasses],
      fechada: editFechada,
      ativa:   true,
    });
  }

  document.getElementById('ze-box').style.display = 'none';
  editId = null; desenhando = false; cursor = null;
  canvas.classList.replace('modo-desenho', 'modo-idle');
  document.getElementById('badge-desenho').classList.remove('visivel');
  salvarEEnviar();
}

function zeCancelar() {
  document.getElementById('ze-box').style.display = 'none';
  editId = null; desenhando = false; cursor = null;
  editPontos = []; editFechada = false;
  canvas.classList.replace('modo-desenho', 'modo-idle');
  document.getElementById('badge-desenho').classList.remove('visivel');
  renderizar();
}

// ─── canvas sincronização ─────────────────────────────────────────────────
function sincronizarCanvas() {
  canvas.width  = area.clientWidth;
  canvas.height = area.clientHeight;
  renderizar();
}

new ResizeObserver(sincronizarCanvas).observe(area);
sincronizarCanvas();

// ─── eventos do canvas ────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  if (!desenhando) return;
  const r = canvas.getBoundingClientRect();
  cursor = { x: e.clientX - r.left, y: e.clientY - r.top };
  renderizar();
});

canvas.addEventListener('mouseleave', () => { if (desenhando) { cursor = null; renderizar(); } });

canvas.addEventListener('click', e => {
  if (!desenhando) return;
  const r  = canvas.getBoundingClientRect();
  const pt = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (editPontos.length >= 3 && distancia(pt, editPontos[0]) < RAIO_FECHA) {
    zeFecharPoligono(); return;
  }
  editPontos.push(pt);
  renderizar();
});

canvas.addEventListener('dblclick', () => {
  if (!desenhando) return;
  if (editPontos.length > 0) editPontos.pop();
  zeFecharPoligono();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && desenhando) zeCancelarDesenho();
  if ((e.key === 'Enter' || e.key === 'z') && desenhando && editPontos.length >= 3) zeFecharPoligono();
});

// ─── renderização ─────────────────────────────────────────────────────────
function renderizar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();

  // desenha todas as zonas salvas
  zonas.forEach(z => {
    if (!z.fechada || z.pontos.length < 3) return;
    const pts = z.pontos.map(p => canvasCoord(p));
    const alpha = z.ativa ? 1 : 0.35;
    ctx.globalAlpha = alpha;
    desenharPoligono(pts, z.cor, z.modo, z.nome);
  });

  ctx.globalAlpha = 1;

  // zona sendo editada
  if (editId !== null || document.getElementById('ze-box').style.display !== 'none') {
    if (editFechada && editPontos.length >= 3) {
      desenharPoligono(editPontos, editCor, editModo, '');
    } else if (editPontos.length > 0) {
      // linhas em progresso
      ctx.beginPath();
      ctx.moveTo(editPontos[0].x, editPontos[0].y);
      editPontos.forEach((p, i) => { if (i > 0) ctx.lineTo(p.x, p.y); });
      ctx.strokeStyle = editCor;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (cursor) {
        const ult = editPontos[editPontos.length - 1];
        ctx.beginPath();
        ctx.moveTo(ult.x, ult.y);
        ctx.lineTo(cursor.x, cursor.y);
        ctx.strokeStyle = editCor + '88';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (cursor && editPontos.length >= 3 && distancia(cursor, editPontos[0]) < RAIO_FECHA) {
        ctx.beginPath();
        ctx.arc(editPontos[0].x, editPontos[0].y, RAIO_FECHA, 0, Math.PI * 2);
        ctx.strokeStyle = editCor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      editPontos.forEach((p, i) => desenharPonto(p, i === 0 ? 5 : 3.5, editCor));
    }
  }

  ctx.restore();
}

function desenharPoligono(pts, cor, modo, nome) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.forEach((p, i) => { if (i > 0) ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.fillStyle = cor + '2e';
  ctx.fill();
  ctx.strokeStyle = cor;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8, 5]);
  ctx.stroke();
  ctx.setLineDash([]);

  if (nome) {
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
    const label = nome + ' · ' + (modo === 'dentro' ? 'DENTRO' : 'FORA');
    ctx.font = '10px Share Tech Mono, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(18,18,18,0.75)';
    ctx.fillRect(cx - tw/2 - 6, cy - 9, tw + 12, 18);
    ctx.fillStyle = cor;
    ctx.fillText(label, cx, cy);
  }

  pts.forEach(p => desenharPonto(p, 3.5, cor));
}

function desenharPonto(p, raio, cor) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, raio, 0, Math.PI * 2);
  ctx.fillStyle = cor;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function distancia(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// ─── caixas de detecção ───────────────────────────────────────────────────
canvasBoxes = document.getElementById('canvas-boxes');
ctxBoxes    = canvasBoxes.getContext('2d');

new ResizeObserver(() => {
  canvasBoxes.width  = area.clientWidth;
  canvasBoxes.height = area.clientHeight;
  desenharCaixas(ultimasCaixas);
}).observe(area);

function corCaixa(nome) {
  if (nome.startsWith('SEM-')) return '#C73C3C';
  if (['Capacete','Mascara','Colete','Oculos de Protecao'].includes(nome)) return '#22c55e';
  if (nome === 'SEM-Oculos de Protecao') return '#C73C3C';
  return '#A0A0A0';
}

function desenharCaixas(caixas) {
  if (!ctxBoxes) return;
  ctxBoxes.clearRect(0, 0, canvasBoxes.width, canvasBoxes.height);
  if (!caixasAtivas || !caixas.length) return;

  const W = canvasBoxes.width, H = canvasBoxes.height;
  caixas.filter(c => classesAtivas.has(c.nome)).forEach(({ nome, conf, bbox }) => {
    const [x1n, y1n, x2n, y2n] = bbox;
    const x = x1n*W, y = y1n*H, w = (x2n-x1n)*W, h = (y2n-y1n)*H;
    const cor = corCaixa(nome);
    ctxBoxes.strokeStyle = cor;
    ctxBoxes.lineWidth = 2;
    ctxBoxes.strokeRect(x, y, w, h);
    const label = `${nome}  ${conf}%`;
    ctxBoxes.font = '11px Share Tech Mono, monospace';
    const tw = ctxBoxes.measureText(label).width;
    const lh = 16, ly = y > lh+2 ? y-lh-2 : y+h+2;
    ctxBoxes.fillStyle = 'rgba(18,18,18,0.75)';
    ctxBoxes.fillRect(x, ly, tw+10, lh+2);
    ctxBoxes.fillStyle = cor;
    ctxBoxes.fillText(label, x+5, ly+lh-3);
  });
}

function toggleCaixas() {
  caixasAtivas = !caixasAtivas;
  document.getElementById('btn-caixas').classList.toggle('ativo', caixasAtivas);
  desenharCaixas(ultimasCaixas);
}

// ─── inferência local ONNX ─────────────────────────────────────────────────
async function carregarModeloLocal() {
  if (sessaoLocal || !window.ort) return sessaoLocal;
  statusCamera('Carregando modelo local...');
  ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);
  sessaoLocal = await ort.InferenceSession.create(MODELO_LOCAL_URL, {
    executionProviders: ['wasm'],
    graphOptimizationLevel: 'all',
  });
  statusCamera('Modelo local pronto');
  return sessaoLocal;
}

function intersecaoSobreUniao(a, b) {
  const x1 = Math.max(a.bbox[0], b.bbox[0]);
  const y1 = Math.max(a.bbox[1], b.bbox[1]);
  const x2 = Math.min(a.bbox[2], b.bbox[2]);
  const y2 = Math.min(a.bbox[3], b.bbox[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const areaA = Math.max(0, a.bbox[2] - a.bbox[0]) * Math.max(0, a.bbox[3] - a.bbox[1]);
  const areaB = Math.max(0, b.bbox[2] - b.bbox[0]) * Math.max(0, b.bbox[3] - b.bbox[1]);
  return inter / Math.max(1e-6, areaA + areaB - inter);
}

function nmsLocal(dets, limite = 0.45) {
  const ordenadas = [...dets].sort((a, b) => b.score - a.score);
  const saida = [];
  while (ordenadas.length) {
    const atual = ordenadas.shift();
    saida.push(atual);
    for (let i = ordenadas.length - 1; i >= 0; i--) {
      if (ordenadas[i].nome === atual.nome && intersecaoSobreUniao(atual, ordenadas[i]) > limite) {
        ordenadas.splice(i, 1);
      }
    }
  }
  return saida;
}

function pontoDentroLocal(px, py, pontos) {
  let dentro = false;
  for (let i = 0, j = pontos.length - 1; i < pontos.length; j = i++) {
    const xi = pontos[i].x, yi = pontos[i].y;
    const xj = pontos[j].x, yj = pontos[j].y;
    if ((yi > py) !== (yj > py) && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) dentro = !dentro;
  }
  return dentro;
}

function emZonaLocal(bbox, zona) {
  const pontos = zona.pontos || [];
  if (!pontos.length) return false;
  const cx = (bbox[0] + bbox[2]) / 2;
  const cy = (bbox[1] + bbox[3]) / 2;
  const dentro = pontoDentroLocal(cx, cy, pontos);
  return (zona.modo || 'dentro') === 'dentro' ? dentro : !dentro;
}

function zonasDaDeteccaoLocal(bbox, nome) {
  return zonas.filter(z => z.ativa !== false && (z.classes || []).includes(nome) && emZonaLocal(bbox, z));
}

function deteccoesDaSaidaLocal(output) {
  const dados = output.data;
  const dims = output.dims;
  const canais = dims[1];
  const total = dims[2];
  const dets = [];

  for (let i = 0; i < total; i++) {
    const cx = dados[i];
    const cy = dados[total + i];
    const w = dados[2 * total + i];
    const h = dados[3 * total + i];
    let melhorClasse = -1;
    let melhorScore = 0;

    for (let c = 4; c < canais; c++) {
      const score = dados[c * total + i];
      if (score > melhorScore) {
        melhorScore = score;
        melhorClasse = c - 4;
      }
    }

    const nome = CLASSES_MODELO[melhorClasse];
    const limiar = nome ? (confiancasConfig[nome] ?? confGeralConfig) : 1;
    if (!nome || melhorScore < limiar) continue;

    dets.push({
      nome,
      conf: Math.round(melhorScore * 100),
      score: melhorScore,
      bbox: [
        Math.max(0, (cx - w / 2) / IMG_SIZE_LOCAL),
        Math.max(0, (cy - h / 2) / IMG_SIZE_LOCAL),
        Math.min(1, (cx + w / 2) / IMG_SIZE_LOCAL),
        Math.min(1, (cy + h / 2) / IMG_SIZE_LOCAL),
      ],
    });
  }
  return nmsLocal(dets).slice(0, 50);
}

function emitirAlertasLocais(deteccoes) {
  if (!wsCliente || wsCliente.readyState !== WebSocket.OPEN) return;
  const agora = Date.now() / 1000;
  const intervalo = 3;

  deteccoes.forEach(det => {
    if (!det.nome.startsWith('SEM-')) return;
    let zonasEvento = [];
    if (zonas.some(z => z.ativa !== false)) {
      zonasEvento = zonasDaDeteccaoLocal(det.bbox, det.nome);
    } else if (classesAtivas.has(det.nome)) {
      zonasEvento = [{ id: '__geral__', nome: 'Geral', cor: '#C73C3C' }];
    }

    zonasEvento.forEach(z => {
      const chave = `${det.nome}:${z.id}`;
      if (agora - (ultimoAlertaLocal.get(chave) || 0) < intervalo) return;
      ultimoAlertaLocal.set(chave, agora);
      wsCliente.send(JSON.stringify({
        tipo: 'evento_cliente',
        evento: {
          tipo: 'alerta',
          camera: 'NAVEGADOR',
          msg: `SEM ${det.nome.replace('SEM-', '')} detectado`,
          confianca: det.conf,
          zona: z.nome,
          cor_zona: z.cor || '#C73C3C',
        },
      }));
    });
  });
}

async function executarInferenciaLocal() {
  if (inferenciaRodando || modoServidor || !streamAtivo) return;
  const video = document.getElementById('video');
  if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) return;

  inferenciaRodando = true;
  try {
    const sessao = await carregarModeloLocal();
    if (!sessao) return;

    canvasInferencia.width = IMG_SIZE_LOCAL;
    canvasInferencia.height = IMG_SIZE_LOCAL;
    const ctxInf = canvasInferencia.getContext('2d', { willReadFrequently: true });
    ctxInf.drawImage(video, 0, 0, IMG_SIZE_LOCAL, IMG_SIZE_LOCAL);
    const pixels = ctxInf.getImageData(0, 0, IMG_SIZE_LOCAL, IMG_SIZE_LOCAL).data;
    const entrada = new Float32Array(3 * IMG_SIZE_LOCAL * IMG_SIZE_LOCAL);
    const areaImg = IMG_SIZE_LOCAL * IMG_SIZE_LOCAL;
    for (let i = 0, p = 0; i < pixels.length; i += 4, p++) {
      entrada[p] = pixels[i] / 255;
      entrada[areaImg + p] = pixels[i + 1] / 255;
      entrada[2 * areaImg + p] = pixels[i + 2] / 255;
    }

    const nomeEntrada = sessao.inputNames[0];
    const feeds = {};
    feeds[nomeEntrada] = new ort.Tensor('float32', entrada, [1, 3, IMG_SIZE_LOCAL, IMG_SIZE_LOCAL]);
    const resultados = await sessao.run(feeds);
    const saida = resultados[sessao.outputNames[0]];
    const deteccoes = deteccoesDaSaidaLocal(saida);
    ultimasCaixas = deteccoes.map(({ nome, conf, bbox }) => ({ nome, conf, bbox }));
    desenharCaixas(ultimasCaixas);
    emitirAlertasLocais(ultimasCaixas);
  } catch (err) {
    console.error(err);
    statusCamera('IA local indisponivel; usando servidor');
    inferenciaLocalAtiva = false;
    iniciarEnvioFrames();
  } finally {
    inferenciaRodando = false;
  }
}

async function iniciarInferenciaLocal() {
  if (inferenciaTimer) clearInterval(inferenciaTimer);
  try {
    await carregarModeloLocal();
    inferenciaLocalAtiva = true;
    pararEnvioFrames();
    inferenciaTimer = setInterval(executarInferenciaLocal, 250);
    executarInferenciaLocal();
  } catch (err) {
    console.error(err);
    inferenciaLocalAtiva = false;
    iniciarEnvioFrames();
  }
}

// ─── WebSocket ────────────────────────────────────────────────────────────
function enviarZonas() {
  if (!wsCliente || wsCliente.readyState !== WebSocket.OPEN) return;
  const zonasAtivas = zonas
    .filter(z => z.ativa)
    .map(z => ({ ...z, classes: (z.classes || []).filter(classeDisponivel) }))
    .filter(z => z.classes.length);
  wsCliente.send(JSON.stringify({ tipo: 'zonas', zonas: zonasAtivas }));
}

let _wsPort = 8765;

function urlWebSocket() {
  if (location.protocol === 'https:') return `wss://${location.host}/ws`;
  return `ws://${location.hostname}:${_wsPort}`;
}

function conectarWS() {
  wsCliente = new WebSocket(urlWebSocket());
  wsCliente.onopen = () => { atualizar(); enviarZonas(); enviarFrameCliente(); };
  wsCliente.onmessage = ({ data }) => {
    try {
      const ev = JSON.parse(data);
      if (ev.tipo === 'frame') {
        ultimasCaixas = ev.caixas || [];
        desenharCaixas(ultimasCaixas);
        envioEmAndamento = false;
        if (envioTimeout) clearTimeout(envioTimeout);
        envioTimeout = null;
      }
    } catch {}
  };
  wsCliente.onclose = () => { envioEmAndamento = false; setTimeout(conectarWS, 3000); };
  wsCliente.onerror = () => wsCliente.close();
}

// carrega porta WS do servidor
fetch('/api/config')
  .then(r => r.json())
  .catch(() => ({ ws_port: 8765 }))
  .then(cfg => {
    aplicarDisponibilidadeModelos(cfg);
    if (cfg.confianca_padrao != null) confGeralConfig  = cfg.confianca_padrao;
    if (cfg.confiancas       != null) confiancasConfig = cfg.confiancas;
    atualizar();
    _wsPort = cfg.ws_port || 8765;
    conectarWS();
  });

// ─── modo câmera servidor (MJPEG /stream) ────────────────────────────────────
function toggleModoCam() {
  modoServidor = !modoServidor;
  const video  = document.getElementById('video');
  const img    = document.getElementById('stream-img');
  const btn    = document.getElementById('btn-modo-cam');
  const camOff = document.getElementById('cam-off');

  if (modoServidor) {
    pararEnvioFrames();
    pararInferenciaLocal();
    if (streamAtivo) { streamAtivo.getTracks().forEach(t => t.stop()); streamAtivo = null; }
    video.srcObject = null;
    video.style.display = 'none';
    img.src = '/stream';
    img.style.display = 'block';
    camOff.style.display = 'none';
    btn.classList.add('ativo');
    btn.textContent = 'CÂMERA LOCAL';
  } else {
    img.style.display = 'none';
    img.src = '';
    video.style.display = 'block';
    btn.classList.remove('ativo');
    btn.textContent = 'CÂMERA SERVIDOR';
    iniciarCamera();
  }
}

// sincroniza zonas entre abas via localStorage (storage event dispara em outras abas)
window.addEventListener('storage', e => {
  if (e.key === 'epi_zonas' && e.newValue) {
    const novas = JSON.parse(e.newValue);
    if (JSON.stringify(novas) !== JSON.stringify(zonas)) {
      zonas = novas;
      renderLista();
      renderizar();
      enviarZonas();
    }
  }
});

// carrega zonas do localStorage e renderiza
renderLista();
renderizar();
